name: Collect and publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = GamerPower preview, sources = new-source preview, live = real channel, test = test channel'
        required: true
        default: dry
        type: choice
        options: [dry, sources, live, test]

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    # Standard GitHub-hosted runners are free only while this repository is public.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
      DRY_RUN: ${{ vars.ENABLE_PUBLISH == 'true' && inputs.mode == 'live' && 'false' || 'true' }}
      TEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && 'true' || 'false' }}
      STATE_SYNC_GIT: ${{ vars.ENABLE_PUBLISH == 'true' && inputs.mode == 'live' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Configure state commits
        if: env.STATE_SYNC_GIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: npm start
      - name: Preview new sources without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sources'
        run: npm run preview:sources
      - name: Upload dry run previews
        if: env.DRY_RUN == 'true' && env.TEST_PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: preview-${{ github.run_id }}
          path: dry-run/
          if-no-files-found: ignore
          retention-days: 1
